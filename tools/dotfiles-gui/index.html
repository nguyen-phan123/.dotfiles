<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dotfiles Manager</title>
  <style>
    :root {
      --bg: #12131a;
      --card: #1b1d28;
      --border: #2b2e40;
      --text: #e2e8f0;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --green: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .btn {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .theme-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.15s, border-color 0.15s;
    }
    .theme-card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .theme-card.active { border-color: var(--green); box-shadow: 0 0 10px rgba(34, 197, 94, 0.2); }
    .preview-box { height: 36px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
    .status-badge { font-size: 12px; color: var(--green); font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>⚡ Dotfiles Visual Manager</h1>
      <p id="currentStatus" style="font-size: 14px; color: #94a3b8; margin-top: 4px;">Loading...</p>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="btn" onclick="syncAntigravity()">🔄 Sync Antigravity IDE</button>
    </div>
  </div>

  <h2 style="margin-bottom: 12px; font-size: 18px;">🎨 Ghostty Terminal Themes</h2>
  <div class="grid" id="themesGrid"></div>

  <script>
    let currentTheme = '';

    async function loadStatus() {
      const res = await fetch('/api/status');
      const data = await res.json();
      currentTheme = data.ghostty.theme;
      document.getElementById('currentStatus').innerText = `Active Ghostty Theme: ${currentTheme}`;
    }

    async function loadThemes() {
      await loadStatus();
      const res = await fetch('/api/themes');
      const themes = await res.json();
      const grid = document.getElementById('themesGrid');
      grid.innerHTML = '';
      themes.forEach(t => {
        const card = document.createElement('div');
        card.className = `theme-card ${t.id === currentTheme ? 'active' : ''}`;
        card.onclick = () => applyTheme(t.id);
        card.innerHTML = `
          <div class="preview-box" style="background: ${t.background}; color: ${t.foreground};">
            ${t.name}
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:13px; font-weight:500;">${t.name}</span>
            ${t.id === currentTheme ? '<span class="status-badge">Active</span>' : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function applyTheme(name) {
      const res = await fetch('/api/theme/apply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ theme: name })
      });
      if (res.ok) {
        await loadThemes();
      }
    }

    async function syncAntigravity() {
      const btn = event.target;
      btn.innerText = 'Syncing...';
      const res = await fetch('/api/sync/antigravity', { method: 'POST' });
      const data = await res.json();
      btn.innerText = '🔄 Sync Antigravity IDE';
      alert(data.success ? 'Đã đồng bộ thành công Antigravity IDE!' : 'Lỗi đồng bộ: ' + data.error);
    }

    loadThemes();
  </script>
</body>
</html>
