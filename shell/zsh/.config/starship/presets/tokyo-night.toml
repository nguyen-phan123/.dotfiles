# Tokyo Night Compact Preset
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
continuation_prompt = "[▸▹ ](#7dcfff)"

format = """
$directory\
$git_branch\
$git_status\
$git_metrics\
$package\
$dart\
$nodejs\
$bun\
$deno\
$python\
$rust\
$golang\
$java\
$docker_context\
$cmd_duration\
$time\
$line_break\
$status\
$sudo\
$character"""

right_format = """"""

[character]
success_symbol = "[❯](bold #7aa2f7)"
error_symbol = "[❯](bold #f7768e)"
vimcmd_symbol = "[❮](bold #9ece6a)"

[directory]
style = "bold #7aa2f7"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 󰌾"
read_only_style = "bold #f7768e"

[git_branch]
symbol = "󰘬 "
style = "bold #bb9af7"
format = "[$symbol$branch(:$remote_branch)]($style) "
truncation_length = 24

[git_status]
style = "bold #e0af68"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "󰞇 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "? "
stashed = "📦 "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "✘ "

[git_metrics]
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'
added_style = 'bold #9ece6a'
deleted_style = 'bold #f7768e'
disabled = false

[package]
symbol = "󰏗 "
style = "dimmed #e0af68"
format = "[$symbol$version]($style) "

[dart]
symbol = " "
style = "bold #7dcfff"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = "󰎙 "
style = "bold #9ece6a"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "bold #e0af68"
format = "[${symbol}${version}]($style) "

[cmd_duration]
min_time = 2_000
style = "bold #e0af68"
format = "󱎫 [$duration]($style) "

[time]
disabled = false
time_format = "%R"
style = "dimmed #565f89"
format = "󰥔 [$time]($style) "
